name: CI/CD Workflow

# What this pipeline does for the cake factory (the Go code lives in src/):
#   lint         gofmt, go vet and hadolint on the Dockerfile
#   test         go build and go test (a failing test stops the pipeline)
#   integration  starts the whole stack with docker compose and runs the demo
#                scenarios against it (crashes, frozen node, monitor down,
#                broker restart); see src/docs/demo.md
#   images       builds one image per system and pushes it to ghcr.io (only on
#                a push to main or master)
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  IMAGE_PREFIX: cake-factory

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not formatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/Dockerfile
          ignore: DL3018

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum
      - name: Build all services
        run: go build ./...
      - name: Unit tests
        run: go test ./...

  integration:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    env:
      SIM_SPEED: "3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum
      - name: Start the stack (SQL Server, MongoDB, MQTT broker, five systems)
        run: |
          docker compose up -d --build
          for _ in $(seq 1 60); do
            unhealthy="$(docker compose ps --format '{{.Name}} {{.Status}}' | grep -v healthy || true)"
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          docker compose ps
      - name: Run the demo scenarios
        run: go run ./cmd/scenario healthy crash-plm crash-bat crash-thm crash-fin crash-bt freeze-thm band-halt band-section-stop bt-down mon-down broker-restart sql-down mongo-down cooling-chain faults-system faults-maintenance
      - name: Show logs of the stack
        if: always()
        run: docker compose logs --no-color --tail=300
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  build-push-images:
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        service: [plm, bat, thm, fin, bt, mon, ui]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Transform owner to lowercase
        run: echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LOWER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  # No deploy job: there is no target machine yet. Add one that pulls these
  # images and runs src/docker-compose.yml when a deployment target exists.
