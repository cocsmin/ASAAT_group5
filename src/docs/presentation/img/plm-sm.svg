<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 720" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker></defs>
<style>.t{fill:#111827}.h{font-weight:700;font-size:15px}.m{fill:#4b5563;font-size:12px}.b{fill:#fff;stroke:#374151;stroke-width:1.5}.ar{stroke:#374151;stroke-width:1.5;fill:none;marker-end:url(#a)}.lb{fill:#1f2937;font-size:12.5px}</style>
<rect width="1460" height="720" fill="#fff"/>
<text class="t h" x="30" y="30">PLM: state machine of the Production and Logistics system</text>
<rect class="b" x="70" y="100" width="250" height="78" rx="12"/><text class="t h" x="195" y="124" text-anchor="middle">Scheduling_Order</text><text class="m" x="195" y="146" text-anchor="middle">entry: create new production order</text><rect class="b" x="400" y="100" width="250" height="78" rx="12"/><text class="t h" x="525" y="124" text-anchor="middle">Fetching_recipe_targets</text><text class="m" x="525" y="146" text-anchor="middle">entry: query recipe database</text><rect class="b" x="770" y="100" width="250" height="78" rx="12"/><text class="t h" x="895" y="124" text-anchor="middle">Idle</text><text class="m" x="895" y="146" text-anchor="middle">entry: set system state to ready</text><text class="m" x="895" y="163" text-anchor="middle">do: new order every 22 s if MON online</text><rect class="b" x="770" y="300" width="250" height="78" rx="12"/><text class="t h" x="895" y="324" text-anchor="middle">Verifying_Inventory</text><text class="m" x="895" y="346" text-anchor="middle">entry: enforce organic ingredient rule</text><text class="m" x="895" y="363" text-anchor="middle">do: stock requested vs available</text><rect class="b" x="400" y="300" width="250" height="78" rx="12"/><text class="t h" x="525" y="324" text-anchor="middle">Communication_Suspended</text><text class="m" x="525" y="346" text-anchor="middle">entry: log WMS unresponsiveness</text><text class="m" x="525" y="363" text-anchor="middle">do: monitor warehouse (timeout 2 s)</text><rect class="b" x="400" y="470" width="250" height="78" rx="12"/><text class="t h" x="525" y="494" text-anchor="middle">Reserving_Ingredients</text><text class="m" x="525" y="516" text-anchor="middle">entry: lock required quantities</text><rect class="b" x="1140" y="470" width="250" height="78" rx="12"/><text class="t h" x="1265" y="494" text-anchor="middle">Holding_Order</text><text class="m" x="1265" y="516" text-anchor="middle">entry: suspend active order</text><text class="m" x="1265" y="533" text-anchor="middle">do: await restock (after 15 s)</text><rect class="b" x="400" y="620" width="250" height="78" rx="12"/><text class="t h" x="525" y="644" text-anchor="middle">Waiting_For_Withdrawal</text><text class="m" x="525" y="666" text-anchor="middle">do: await retrieval (confirmation after 3 s)</text><rect class="b" x="770" y="620" width="250" height="78" rx="12"/><text class="t h" x="895" y="644" text-anchor="middle">Updating_Inventory</text><text class="m" x="895" y="666" text-anchor="middle">entry: deduct withdrawn quantities</text><circle cx="40" cy="139" r="8" fill="#111827"/><polyline class="ar" points="48,139 70,139"/><polyline class="ar" points="320,130 400,130"/><text class="lb" x="360" y="108" text-anchor="middle">recipe</text><text class="lb" x="360" y="124" text-anchor="middle">request</text><polyline class="ar" points="650,130 770,130"/><text class="lb" x="710" y="108" text-anchor="middle">order to</text><text class="lb" x="710" y="124" text-anchor="middle">BAT</text><polyline class="ar" points="935,100 935,62 195,62 195,100"/><text class="lb" x="545" y="54" text-anchor="middle">after (22 s)</text><polyline class="ar" points="895,178 895,300"/><text class="lb" x="905" y="240" text-anchor="start">Ingredient request</text><polyline class="ar" points="770,322 650,322"/><text class="lb" x="710" y="296" text-anchor="middle">wms_timeout /</text><text class="lb" x="710" y="312" text-anchor="middle">use staged ingr.</text><polyline class="ar" points="525,300 525,235 835,235 835,178"/><text class="lb" x="535" y="226" text-anchor="start">wms_responsive_confirmation</text><polygon points="895,424 917,440 895,456 873,440" fill="#fff" stroke="#374151" stroke-width="1.5"/><text class="m" x="925" y="428">StockCheck</text><polyline class="ar" points="895,378 895,424"/><polyline class="ar" points="873,440 525,440 525,470"/><text class="lb" x="730" y="432" text-anchor="middle">[stock ≥ requested]</text><polyline class="ar" points="917,440 1265,440 1265,470"/><text class="lb" x="1150" y="414" text-anchor="middle">[stock &lt; requested] / missing-ingredients error,</text><text class="lb" x="1150" y="430" text-anchor="middle">insufficient stock to BAT</text><polyline class="ar" points="1350,470 1350,352 1020,352"/><text class="lb" x="1340" y="344" text-anchor="end">Restock signal</text><polyline class="ar" points="525,548 525,620"/><polyline class="ar" points="650,659 770,659"/><text class="lb" x="710" y="636" text-anchor="middle">Withdrawal</text><text class="lb" x="710" y="652" text-anchor="middle">confirmation</text><polyline class="ar" points="1020,659 1420,659 1420,130 1020,130"/><text class="lb" x="1215" y="648" text-anchor="middle">send reservation result to BAT</text></svg>
