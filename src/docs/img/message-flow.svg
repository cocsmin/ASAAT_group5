<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs>
<style>.t{fill:#111827}.h{font-weight:600;font-size:15px}.m{fill:#6b7280;font-size:12px}.sy{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.4}.mo{fill:#fef3c7;stroke:#d97706;stroke-width:1.4}
.ar{stroke:#374151;stroke-width:1.5;fill:none;marker-end:url(#a)}.bl{stroke:#2563eb;stroke-width:1.5;fill:none;marker-end:url(#b)}.lb{fill:#374151;font-size:12px}.bu{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.4}</style>
<rect width="1500" height="760" fill="#fff"/>
<text class="t h" x="30" y="26">Message flow between the systems (all of it travels through the MQTT broker, Sparkplug B)</text>
<rect class="sy" x="40" y="110" width="170" height="90" rx="8"/><text class="t h" x="125" y="150" text-anchor="middle">PLM</text><text class="m" x="125" y="170" text-anchor="middle">Production &amp; Logistics</text><rect class="sy" x="400" y="110" width="170" height="90" rx="8"/><text class="t h" x="485" y="150" text-anchor="middle">BAT</text><text class="m" x="485" y="170" text-anchor="middle">Batter Preparation</text><rect class="sy" x="760" y="110" width="170" height="90" rx="8"/><text class="t h" x="845" y="150" text-anchor="middle">THM</text><text class="m" x="845" y="170" text-anchor="middle">Thermal Processing</text><rect class="sy" x="1120" y="110" width="170" height="90" rx="8"/><text class="t h" x="1205" y="150" text-anchor="middle">FIN</text><text class="m" x="1205" y="170" text-anchor="middle">Finishing &amp; Packaging</text><line class="ar" x1="210" y1="130" x2="400" y2="130"/><text class="lb" x="305" y="124" text-anchor="middle">Production order and</text><text class="lb" x="305" y="146" text-anchor="middle">recipe targets</text><line class="ar" x1="400" y1="175" x2="210" y2="175"/><text class="lb" x="305" y="169" text-anchor="middle">Ingredient request and</text><text class="lb" x="305" y="191" text-anchor="middle">reservation result (both ways)</text><line class="ar" x1="570" y1="130" x2="760" y2="130"/><text class="lb" x="665" y="124" text-anchor="middle">Batter ready</text><line class="ar" x1="760" y1="175" x2="570" y2="175"/><text class="lb" x="665" y="169" text-anchor="middle">Depositing stopped /</text><text class="lb" x="665" y="191" text-anchor="middle">working again</text><line class="ar" x1="930" y1="124" x2="1120" y2="124"/><text class="lb" x="1025" y="118" text-anchor="middle">Pan for washing</text><line class="ar" x1="930" y1="144" x2="1120" y2="144"/><text class="lb" x="1025" y="138" text-anchor="middle">Cooled cake</text><line class="ar" x1="1120" y1="164" x2="930" y2="164"/><text class="lb" x="1025" y="158" text-anchor="middle">Pan request</text><line class="ar" x1="1120" y1="184" x2="930" y2="184"/><text class="lb" x="1025" y="178" text-anchor="middle">Clean pan supply</text><line class="ar" x1="1120" y1="204" x2="930" y2="204"/><text class="lb" x="1025" y="198" text-anchor="middle">Stop / resume pan admission</text><polyline class="ar" points="1205,110 1205,60 125,60 125,110"/><text class="lb" x="665" y="52" text-anchor="middle">Pallet ready for shipment</text><rect class="bu" x="40" y="330" width="1250" height="46" rx="8"/><text class="t h" x="665" y="352" text-anchor="middle">MQTT broker (Mosquitto): Sparkplug B, QoS 1, persistent sessions</text><text class="m" x="665" y="368" text-anchor="middle">the signals above travel through it; birth and death certificates are the failure detector</text><line class="bl" x1="125" y1="200" x2="125" y2="330"/><line class="bl" x1="485" y1="200" x2="485" y2="330"/><line class="bl" x1="845" y1="200" x2="845" y2="330"/><line class="bl" x1="1205" y1="200" x2="1205" y2="330"/><text class="lb" x="133" y="270">events, heartbeat to MON</text><text class="lb" x="133" y="286">(repair confirmed back)</text><rect class="mo" x="520" y="470" width="170" height="90" rx="8"/><text class="t h" x="605" y="510" text-anchor="middle">MON</text><text class="m" x="605" y="530" text-anchor="middle">Line Monitoring &amp; Health</text><rect class="mo" x="900" y="470" width="170" height="90" rx="8"/><text class="t h" x="985" y="510" text-anchor="middle">BT</text><text class="m" x="985" y="530" text-anchor="middle">Band Transport</text><line class="bl" x1="605" y1="376" x2="605" y2="470"/><text class="lb" x="597" y="430" text-anchor="end">events, heartbeat (in)</text><text class="lb" x="597" y="446" text-anchor="end">repair confirmed (out)</text><line class="ar" x1="690" y1="500" x2="900" y2="500"/><text class="lb" x="795" y="492" text-anchor="middle">Section command,</text><text class="lb" x="795" y="518" text-anchor="middle">Target speed</text><line class="bl" x1="985" y1="470" x2="985" y2="376"/><text class="lb" x="993" y="430">Band state change to THM, FIN, MON</text><text class="m" x="30" y="744">Black arrows: the 14 signals between the systems. Blue lines: connections to the broker. Section command and Target speed are operations messages outside the 14 (signals.md).</text></svg>
