<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<style>
.t{fill:#1f2937}.s{fill:#6b7280;font-size:11px}.h{font-weight:600}
.box{fill:#fff;stroke:#9ca3af;stroke-width:1.2}.grp{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1.2}
.host{fill:none;stroke:#6b7280;stroke-width:1.5;stroke-dasharray:6 4}
.bus{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.5}.db{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}
.demo{fill:#fff;stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:4 3}.ln{stroke:#3b82f6;stroke-width:1.5}
</style>
<rect width="1100" height="660" fill="#ffffff"/>
<rect class="host" x="20" y="70" width="1060" height="570" rx="10"/>
<text class="t h" x="36" y="92">Docker host (docker compose)</text>
<rect class="box" x="250" y="12" width="260" height="44" rx="6"/><text class="t h" x="380" y="32" text-anchor="middle">ui (dashboard :8080)</text><text class="s" x="380" y="48" text-anchor="middle">simulates the overseer UI of MON</text><rect class="demo" x="590" y="12" width="260" height="44" rx="6"/><text class="t h" x="720" y="32" text-anchor="middle">ctl (profile demo)</text><text class="s" x="720" y="48" text-anchor="middle">Docker socket: stop, freeze, restart</text><line class="ln" x1="380" y1="56" x2="380" y2="420"/><rect class="grp" x="35" y="110" width="160" height="130" rx="8"/><text class="t h" x="115" y="132" text-anchor="middle">PLM</text><rect class="box" x="47" y="144" width="136" height="30" rx="5"/><text class="t" x="115" y="164" text-anchor="middle">plm-wh</text><rect class="box" x="47" y="182" width="136" height="30" rx="5"/><text class="t" x="115" y="202" text-anchor="middle">plm-ship</text><line class="ln" x1="115" y1="240" x2="115" y2="420"/><rect class="grp" x="209" y="110" width="160" height="168" rx="8"/><text class="t h" x="289" y="132" text-anchor="middle">BAT</text><rect class="box" x="221" y="144" width="136" height="30" rx="5"/><text class="t" x="289" y="164" text-anchor="middle">bat-dose</text><rect class="box" x="221" y="182" width="136" height="30" rx="5"/><text class="t" x="289" y="202" text-anchor="middle">bat-mix</text><rect class="box" x="221" y="220" width="136" height="30" rx="5"/><text class="t" x="289" y="240" text-anchor="middle">bat-insp</text><line class="ln" x1="289" y1="278" x2="289" y2="420"/><rect class="grp" x="383" y="110" width="160" height="206" rx="8"/><text class="t h" x="463" y="132" text-anchor="middle">THM</text><rect class="box" x="395" y="144" width="136" height="30" rx="5"/><text class="t" x="463" y="164" text-anchor="middle">thm-dep</text><rect class="box" x="395" y="182" width="136" height="30" rx="5"/><text class="t" x="463" y="202" text-anchor="middle">thm-bake</text><rect class="box" x="395" y="220" width="136" height="30" rx="5"/><text class="t" x="463" y="240" text-anchor="middle">thm-exit</text><rect class="box" x="395" y="258" width="136" height="30" rx="5"/><text class="t" x="463" y="278" text-anchor="middle">thm-cool</text><line class="ln" x1="463" y1="316" x2="463" y2="420"/><rect class="grp" x="557" y="110" width="160" height="244" rx="8"/><text class="t h" x="637" y="132" text-anchor="middle">FIN</text><rect class="box" x="569" y="144" width="136" height="30" rx="5"/><text class="t" x="637" y="164" text-anchor="middle">fin-dpn</text><rect class="box" x="569" y="182" width="136" height="30" rx="5"/><text class="t" x="637" y="202" text-anchor="middle">fin-qua</text><rect class="box" x="569" y="220" width="136" height="30" rx="5"/><text class="t" x="637" y="240" text-anchor="middle">fin-wrap</text><rect class="box" x="569" y="258" width="136" height="30" rx="5"/><text class="t" x="637" y="278" text-anchor="middle">fin-pal</text><rect class="box" x="569" y="296" width="136" height="30" rx="5"/><text class="t" x="637" y="316" text-anchor="middle">fin-wash</text><line class="ln" x1="637" y1="354" x2="637" y2="420"/><rect class="grp" x="731" y="110" width="160" height="92" rx="8"/><text class="t h" x="811" y="132" text-anchor="middle">BT</text><rect class="box" x="743" y="144" width="136" height="30" rx="5"/><text class="t" x="811" y="164" text-anchor="middle">bt</text><line class="ln" x1="811" y1="202" x2="811" y2="420"/><rect class="grp" x="905" y="110" width="160" height="92" rx="8"/><text class="t h" x="985" y="132" text-anchor="middle">MON</text><rect class="box" x="917" y="144" width="136" height="30" rx="5"/><text class="t" x="985" y="164" text-anchor="middle">mon</text><line class="ln" x1="985" y1="202" x2="985" y2="420"/><rect class="bus" x="60" y="420" width="980" height="48" rx="8"/><text class="t h" x="550" y="441" text-anchor="middle">mosquitto: MQTT broker :1883 (Sparkplug B, QoS 1, persistent sessions)</text><text class="s" x="550" y="458" text-anchor="middle">every container is a client; the death certificate (Last Will) is the failure detector</text><rect class="db" x="120" y="520" width="380" height="84" rx="8"/><text class="t h" x="310" y="544" text-anchor="middle">mssql: SQL Server 2022</text><text class="s" x="310" y="564" text-anchor="middle">stock, recipes, orders, tickets, events</text><text class="s" x="310" y="582" text-anchor="middle">used by PLM, MON, ui</text><rect class="db" x="600" y="520" width="380" height="84" rx="8"/><text class="t h" x="790" y="544" text-anchor="middle">mongo: MongoDB 7</text><text class="s" x="790" y="564" text-anchor="middle">pan and cake documents, saved queues and state</text><text class="s" x="790" y="582" text-anchor="middle">used by the stations, BT, ui</text><text class="s" x="550" y="632" text-anchor="middle">Each container has its own volume (outbox and saved state); Docker restarts a container that exits (restart: unless-stopped).</text></svg>
