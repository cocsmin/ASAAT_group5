# Cake factory: one container per system (Go) plus MQTT broker, SQL Server and
# MongoDB. Start with: docker compose up --build   then open http://localhost:8080
#
# Rules from the architecture decisions that this file implements:
#   restart: unless-stopped   Docker restarts a crashed controller (FC27, THM-REQ-73)
#   MQTT keep-alive 5 s       broker declares a dead node after 7.5 s (THM-REQ-72: 15 s)
#   healthcheck + depends_on  start order without races
#   named volume per service  outbox of undelivered events survives a restart (THM-REQ-77)
#   non-root, read-only root  fast restart, small attack surface
#   cpu and memory limits     a runaway service cannot starve the others
#
# Note: the restart policy restarts a crashed container, not one that was stopped
# or killed by hand (`docker kill`, `docker stop`). Use FC27 on the dashboard to
# crash a controller the way a real fault would.
# Set MSSQL_SA_PASSWORD (for example in a .env file) to change the SQL password.
x-service: &service
  restart: unless-stopped
  read_only: true
  user: "65532:65532"
  cap_drop: [ALL]
  mem_limit: 128m
  cpus: 0.5
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
    interval: 5s
    timeout: 2s
    retries: 5
  depends_on:
    mosquitto: { condition: service_healthy }
    mongo: { condition: service_healthy }

x-env: &env
  MQTT_BROKER: tcp://mosquitto:1883
  MQTT_KEEPALIVE_S: "5"
  MONGO_URI: mongodb://mongo:27017
  HEARTBEAT_SECONDS: "5"       # T_hb, one value for all slices
  OUTBOX_DIR: /data
  HEALTH_ADDR: ":8081"
  FAULT_RATE: "${FAULT_RATE:-0}" # 0: the factory only fails when a fault is injected; 1: the failure rates of the catalog; 5: five times as many
  SIM_SPEED: "${SIM_SPEED:-1}" # raise (SIM_SPEED=3 docker compose up) to run the factory faster

x-sql: &sql
  SQL_DSN: "sqlserver://sa:${MSSQL_SA_PASSWORD:-Cake_Factory1!}@mssql:1433?database=cakefactory&encrypt=disable"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes: ["./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    ports: ["1883:1883"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Cake_Factory1!}"
    volumes: ["mssql-data:/var/opt/mssql"]
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Every system is split per station, one container each (one image, STATION picks the station).
  plm-wh:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: [*env, *sql], STATION: plm-wh, ORDER_SECONDS: "22" }
    volumes: ["plm-wh-data:/data"]
    depends_on:
      mosquitto: { condition: service_healthy }
      mongo: { condition: service_healthy }
      mssql: { condition: service_healthy }

  plm-ship:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: [*env, *sql], STATION: plm-ship }
    volumes: ["plm-ship-data:/data"]
    depends_on:
      mosquitto: { condition: service_healthy }
      mongo: { condition: service_healthy }
      mssql: { condition: service_healthy }

  bat-dose:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: bat-dose }
    volumes: ["bat-dose-data:/data"]

  bat-mix:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: bat-mix }
    volumes: ["bat-mix-data:/data"]

  bat-insp:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: bat-insp }
    volumes: ["bat-insp-data:/data"]

  # Thermal Processing is split per station, one container each (same image, STATION picks the station).
  thm-dep:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: thm-dep }
    volumes: ["thm-dep-data:/data"]

  thm-bake:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: thm-bake }
    volumes: ["thm-bake-data:/data"]

  thm-exit:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: thm-exit }
    volumes: ["thm-exit-data:/data"]

  thm-cool:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: thm-cool }
    volumes: ["thm-cool-data:/data"]

  bt:
    <<: *service
    build: { context: ., args: { SERVICE: bt } }
    environment: { <<: *env }
    volumes: ["bt-data:/data"]

  # Finishing & Packaging is split per station too.
  fin-dpn:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: fin-dpn }
    volumes: ["fin-dpn-data:/data"]

  fin-qua:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: fin-qua }
    volumes: ["fin-qua-data:/data"]

  fin-wrap:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: fin-wrap }
    volumes: ["fin-wrap-data:/data"]

  fin-pal:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: fin-pal, PALLET_SIZE: "24" }
    volumes: ["fin-pal-data:/data"]

  fin-wash:
    <<: *service
    build: { context: ., args: { SERVICE: station } }
    environment: { <<: *env, STATION: fin-wash, PAN_COUNT: "48" }
    volumes: ["fin-wash-data:/data"]

  mon:
    <<: *service
    build: { context: ., args: { SERVICE: mon } }
    environment: { <<: [*env, *sql], HTTP_ADDR: ":8082" }
    volumes: ["mon-data:/data"]
    depends_on:
      mosquitto: { condition: service_healthy }
      mongo: { condition: service_healthy }
      mssql: { condition: service_healthy }

  # Experiment dashboard. Not part of the factory: it only watches it (Sparkplug
  # messages, event log, pans) and runs the experiments. MON keeps working without it.
  ui:
    <<: *service
    build: { context: ., args: { SERVICE: ui } }
    environment: { <<: [*env, *sql], HTTP_ADDR: ":8080", CREW_SECONDS: "${CREW_SECONDS:-0}", MON_URL: "http://mon:8082", CONTROL_URL: "http://ctl:8090" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
    ports: ["${UI_PORT:-8080}:8080"]
    depends_on:
      mosquitto: { condition: service_healthy }
      mongo: { condition: service_healthy }
      mssql: { condition: service_healthy }

  # Component control for the dashboard (stop, start, freeze, restart each part).
  # It holds the Docker socket, which gives it control over the host's containers,
  # so it is opt-in:  docker compose --profile demo up -d
  ctl:
    profiles: ["demo"]
    build: { context: ., args: { SERVICE: ctl } }
    restart: unless-stopped
    user: "0:0"
    read_only: true
    mem_limit: 64m
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    environment: { CTL_ADDR: ":8090" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  mssql-data:
  mongo-data:
  plm-wh-data:
  plm-ship-data:
  bat-dose-data:
  bat-mix-data:
  bat-insp-data:
  thm-dep-data:
  thm-bake-data:
  thm-exit-data:
  thm-cool-data:
  fin-dpn-data:
  fin-qua-data:
  fin-wrap-data:
  fin-pal-data:
  fin-wash-data:
  bt-data:
  mon-data:
